# OpenWEC state (docs/dev/watchdog-linux-design.md 13.2): others may traverse to out/ (admng-watchdog needs the search
# bit) but not list; the database is private. out/ itself comes from admng-watchdog (2750 openwec:admng-watchdog).
d /var/lib/openwec 0751 openwec openwec -
d /var/lib/openwec/db 0700 openwec openwec -
