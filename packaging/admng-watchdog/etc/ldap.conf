# AdMng Watchdog – private libldap configuration (LDAPCONF)
SASL_NOCANON   on
SASL_SECPROPS  minssf=56,noanonymous,noplain
REFERRALS      off
TLS_REQCERT    demand
#TLS_CACERT    /etc/admng-watchdog/tls/dc-ca.pem     (LDAPS option only)
# LDAPS option (Directory.Security = Tls, Port = 636 - design 5.2): Windows DCs reject a SASL security layer inside TLS,
# so replace the SASL_SECPROPS line above by the next one and set TLS_CACERT (the service refuses to start otherwise).
#SASL_SECPROPS minssf=0,maxssf=0,noanonymous,noplain
