name: Release

# Releases of AD Manager. Two ways to start one:
#  - push release notes docs/releases/v<major>.<minor>.<patch>[-suffix].md to a release branch (below). The first line
#    may name the commit to release: <!-- release-commit: <sha> --> (default: the pushed commit; it must be in the
#    branch history). The workflow creates the tag on that commit and the GitHub release. Changing the notes of a tag
#    that already exists only updates the release description;
#  - push a tag v<major>.<minor>.<patch>[-suffix] (notes from docs/releases/<tag>.md at that commit).
# The build job builds, tests and publishes AdMng.exe on Windows and renders screenshots of exactly that commit; the
# openwec-package and linux-package jobs build the Debian packages of AdMng Watchdog from the same commit exactly like
# the CI jobs of the same names (admng-openwec for Debian 12 and 13 with its GPL-3.0 source tarball, admng-watchdog with
# the install test on Debian 12 and 13 and lintian). The release gets the AD Manager zip, the screenshots, the three
# .deb packages, the OpenWEC source tarball and SHA256SUMS.txt of all of them. From 0.3.0 the Watchdog service is
# Linux-only (docs/dev/watchdog-linux-design.md L1): no Windows Watchdog zip is published any more. Tags v0.* and tags
# with a suffix are pre-releases.
# Creating releases needs the repository secret RELEASE_TOKEN (a fine-grained token for this repository with Contents
# and Workflows: read and write): the workflow token is refused here with 403 "Resource not accessible by integration"
# and cannot create a tag on a commit that changes .github/workflows anyway. The plan job fails early without it.
on:
  push:
    tags: ["v*"]
    branches: ["claude/active-directory-manager-w9v9i8", "main"]
    paths: ["docs/releases/v*.md"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  plan:
    name: Plan the release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
      notes: ${{ steps.plan.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Plan
        id: plan
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          PUSHED_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HAS_RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN != '' }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = tag ]; then
            tag="$REF_NAME"
            target="$PUSHED_SHA"
            notes="docs/releases/$tag.md"
          else
            if [ -n "$BEFORE_SHA" ] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
              mapfile -t changed < <(git diff --name-only --diff-filter=AM "$BEFORE_SHA" "$PUSHED_SHA" -- 'docs/releases/v*.md')
            else
              mapfile -t changed < <(git diff --name-only --diff-filter=AM "$PUSHED_SHA^" "$PUSHED_SHA" -- 'docs/releases/v*.md')
            fi
            if [ "${#changed[@]}" -eq 0 ]; then
              echo "No release notes were added or changed by this push."
              echo "mode=skip" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "${#changed[@]}" -gt 1 ]; then
              echo "::error::One release per push: ${changed[*]} changed together."
              exit 1
            fi
            notes="${changed[0]}"
            tag="$(basename "$notes" .md)"
            marker="$(sed -n '1s/^<!-- *release-commit: *\([0-9a-fA-F]\{7,40\}\) *-->.*$/\1/p' "$notes")"
            target="$(git rev-parse --verify "${marker:-$PUSHED_SHA}^{commit}")"
            if ! git merge-base --is-ancestor "$target" "$PUSHED_SHA"; then
              echo "::error::Release commit $target is not in the history of $REF_NAME."
              exit 1
            fi
          fi
          if ! [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            echo "::error::'$tag' is not v<major>.<minor>.<patch>[-suffix]."
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          if [ "$REF_TYPE" = tag ] && [ "$HAS_RELEASE_TOKEN" = true ] \
            && [ "$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || true)" = false ]; then
            # Publishing a release from release notes creates its tag, and that tag push starts this workflow again:
            # the release is complete, and rebuilding would replace its files with ones that no longer match the sums.
            echo "Release $tag is already published; nothing to build."
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -f "$notes" ]; then
            echo "::error::Release notes $notes are missing."
            exit 1
          fi
          if [ "$HAS_RELEASE_TOKEN" != true ]; then
            # The workflow token is refused by the Releases API in this repository (403 "Resource not accessible by
            # integration"), so do not spend a Windows build on a release that cannot be created.
            echo "::error::The repository secret RELEASE_TOKEN is not available to this workflow. Add it under Settings, Secrets and variables, Actions, tab Secrets, Repository secrets (not Variables, Environment, Codespaces or Dependabot secrets)."
            exit 1
          fi
          mode=full
          if [ "$REF_TYPE" != tag ] && git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            existing="$(git rev-parse "refs/tags/$tag^{commit}")"
            if [ "$existing" != "$target" ]; then
              echo "::error::Tag $tag already exists on $existing, not on $target."
              exit 1
            fi
            mode=notes
          fi
          {
            echo "mode=$mode"
            echo "tag=$tag"
            echo "version=$version"
            echo "sha=$target"
            echo "notes=$notes"
          } >> "$GITHUB_OUTPUT"
          echo "Release $tag ($version) of $target, notes $notes, mode $mode."

  build:
    name: Build, test and package (Windows)
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Check the version
        shell: pwsh
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          $prefix = (Select-Xml -Path Directory.Build.props -XPath '//VersionPrefix').Node.InnerText
          if (-not $env:VERSION.StartsWith($prefix)) {
            throw "Release version $($env:VERSION) does not match VersionPrefix $prefix in Directory.Build.props."
          }
          "Releasing AD Manager $($env:VERSION) from $(git rev-parse HEAD)"
      - name: Restore
        run: dotnet restore AdMng.slnx
      - name: Build
        run: dotnet build AdMng.slnx -c Release --no-restore -p:Version=${{ needs.plan.outputs.version }}
      - name: Tests (unit and UI)
        run: dotnet test AdMng.slnx -c Release --no-build
        env:
          ADMNG_UI_TESTS: "1"
      - name: Publish (self-contained single file)
        run: >-
          dotnet publish src/AdMng.App/AdMng.App.csproj -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:Version=${{ needs.plan.outputs.version }} -o publish
      - name: Smoke test published app
        shell: pwsh
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          # AdMng.exe is a GUI application: capture its report through redirected handles and print it.
          $p = Start-Process -FilePath publish/AdMng.exe -ArgumentList '--smoke-test' -PassThru -Wait `
            -RedirectStandardOutput smoke-out.txt -RedirectStandardError smoke-err.txt
          Get-Content smoke-out.txt, smoke-err.txt -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "Smoke test failed with exit code $($p.ExitCode)" }
          $info = (Get-Item publish/AdMng.exe).VersionInfo
          "AdMng.exe file version $($info.FileVersion), product version $($info.ProductVersion)"
          if (-not "$($info.ProductVersion)".StartsWith($env:VERSION)) {
            "::warning::AdMng.exe reports product version '$($info.ProductVersion)', expected $($env:VERSION)."
          }
      - name: Screenshots
        shell: pwsh
        run: |
          dotnet test tests/AdMng.App.UiTests -c Release --no-build --filter "FullyQualifiedName~AdMng.App.UiTests.ScreenshotTests"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $shots = @(Get-ChildItem -Path $env:ADMNG_SCREENSHOTS_DIR -Filter *.png -ErrorAction SilentlyContinue)
          if ($shots.Count -eq 0) { throw "No screenshots were written to $env:ADMNG_SCREENSHOTS_DIR." }
        env:
          ADMNG_UI_TESTS: "1"
          ADMNG_SCREENSHOTS_DIR: ${{ github.workspace }}/screenshots
      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          $version = $env:VERSION
          New-Item -ItemType Directory -Path dist | Out-Null
          # Symbols are not shipped in the zip. SHA256SUMS.txt of all release files is written by the release job.
          $files = Get-ChildItem -Path publish -File | Where-Object { $_.Extension -ne '.pdb' }
          Compress-Archive -Path $files.FullName -DestinationPath "dist/AdMng-$version-win-x64.zip"
          Get-ChildItem screenshots -Filter *.png | ForEach-Object {
            Copy-Item $_.FullName "dist/AdMng-$version-$($_.Name)"
          }
          Get-ChildItem dist | ForEach-Object { "{0}  ({1:N0} bytes)" -f $_.Name, $_.Length }
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: dist/
          retention-days: 7

  openwec-package:
    # As the CI job "openwec-package": OpenWEC from the pinned upstream commit, built in the release's Rust image so that
    # it links that release's libssl/libkrb5/libsasl2; the Debian 13 job also writes the GPL-3.0 corresponding source.
    name: OpenWEC package (Debian ${{ matrix.release }})
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - release: 12
            image: mirror.gcr.io/library/rust:slim-bookworm
          - release: 13
            image: mirror.gcr.io/library/rust:slim-trixie
    container: ${{ matrix.image }}
    steps:
      - name: Build dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            git ca-certificates pkgconf clang make libssl-dev libkrb5-dev libsasl2-dev dpkg-dev binutils xz-utils >/dev/null
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: Build admng-openwec
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          extra=""
          if [ "${{ matrix.release }}" = 13 ]; then extra=--source-tarball; fi
          tools/packaging/build-openwec-deb.sh --release ${{ matrix.release }} --output artifacts/deb $extra
          dpkg-deb -I artifacts/deb/admng-openwec_*_amd64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: admng-openwec-deb${{ matrix.release }}
          path: |
            artifacts/deb/admng-openwec_*.deb
            artifacts/deb/admng-openwec-*-source.tar.xz
          retention-days: 7

  linux-package:
    # As the CI job "linux-package": the admng-watchdog .deb (one amd64 package for Debian 12 and 13, version =
    # VersionPrefix), installed together with that release's admng-openwec into plain Debian containers, and lintian.
    name: Linux package (Debian 12 and 13)
    needs: [plan, openwec-package]
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/download-artifact@v4
        with:
          pattern: admng-openwec-deb*
          path: artifacts/openwec
          merge-multiple: true
      - name: Build admng-watchdog .deb
        run: tools/packaging/build-deb.sh --output artifacts/deb
      - name: Check the version
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          # build-deb.sh takes the version from VersionPrefix (the build job checks that the tag starts with it).
          expected="artifacts/deb/admng-watchdog_${VERSION%%-*}-1_amd64.deb"
          ls -l artifacts/deb/*.deb
          if [ ! -f "$expected" ]; then
            echo "::error::$expected was not built (release $VERSION)."
            exit 1
          fi
      - name: Install test on Debian 12 and 13
        run: |
          deb=$(basename artifacts/deb/admng-watchdog_*_amd64.deb)
          for release in 12 13; do
            echo "::group::Debian $release"
            openwec=$(basename artifacts/openwec/admng-openwec_*~deb${release}_amd64.deb)
            docker run --rm --cap-add=NET_ADMIN -v "$PWD:/src:ro" "mirror.gcr.io/library/debian:$release" \
              bash /src/tools/packaging/test-deb-install.sh "/src/artifacts/deb/$deb" /src/packaging/admng-watchdog \
              "/src/artifacts/openwec/$openwec"
            echo "::endgroup::"
          done
      - name: lintian (Debian 13)
        run: |
          deb=$(basename artifacts/deb/admng-watchdog_*_amd64.deb)
          openwec=$(basename artifacts/openwec/admng-openwec_*~deb13_amd64.deb)
          docker run --rm -v "$PWD:/src:ro" mirror.gcr.io/library/debian:13 bash -c \
            "apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends lintian >/dev/null \
             && lintian --fail-on error --no-tag-display-limit /src/artifacts/deb/$deb /src/artifacts/openwec/$openwec"
      - name: Collect the release files
        # GitHub renames uploaded release assets whose names have special characters (the '+' and '~' of the
        # admng-openwec versions), so the files get plain names here ('+' -> '.', '~' -> '-') and SHA256SUMS.txt lists
        # exactly the published names. The package versions inside the .deb files do not change.
        run: |
          set -euo pipefail
          mkdir -p dist-linux
          shopt -s nullglob
          files=(artifacts/deb/admng-watchdog_*_amd64.deb artifacts/openwec/admng-openwec_*.deb artifacts/openwec/admng-openwec-*-source.tar.xz)
          if [ "${#files[@]}" -ne 4 ]; then
            echo "::error::Expected 4 Linux release files (admng-watchdog, admng-openwec for Debian 12 and 13, OpenWEC source), found ${#files[@]}: ${files[*]}"
            exit 1
          fi
          for f in "${files[@]}"; do
            name=$(basename "$f")
            name=${name//+/.}
            name=${name//\~/-}
            cp -- "$f" "dist-linux/$name"
          done
          ls -l dist-linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release-files
          path: dist-linux/
          retention-days: 7

  release:
    name: Create the GitHub release
    needs: [plan, build, linux-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: linux-release-files
          path: dist
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          rm -f SHA256SUMS.txt
          export LC_ALL=C
          files=(*)
          sha256sum -- "${files[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          TARGET: ${{ needs.plan.outputs.sha }}
          NOTES: ${{ needs.plan.outputs.notes }}
        run: |
          set -euo pipefail
          title="AD Manager ${VERSION}"
          prerelease=()
          case "$TAG" in
            v0.*|*-*) prerelease=(--prerelease) ;;
          esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "$title" --notes-file "$NOTES" "${prerelease[@]}"
          elif [ "$REF_TYPE" = tag ]; then
            gh release create "$TAG" dist/* --verify-tag --title "$title" --notes-file "$NOTES" "${prerelease[@]}"
          else
            # The workflow token may not create a tag on a commit that changes .github/workflows (it cannot get the
            # "workflows" permission), so the release starts as a draft, which creates no tag, and is published below.
            gh release create "$TAG" dist/* --draft --target "$TARGET" --title "$title" --notes-file "$NOTES" "${prerelease[@]}"
          fi
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true ]; then
            if gh release edit "$TAG" --draft=false 2> publish-error.txt; then
              echo "Published $TAG; the tag was created on $TARGET."
            else
              cat publish-error.txt
              echo "::warning::$TAG is ready as a draft release but the workflow token could not create the tag on $TARGET. Publish the draft on GitHub (Releases, $TAG, Edit, Publish release): the tag is then created on $TARGET."
              {
                echo "### $TAG is ready as a draft release"
                echo
                echo "The workflow token could not create the tag on \`$TARGET\`. Open **Releases → $TAG → Edit → Publish release**;"
                echo "GitHub then creates the tag on that commit. All files and the release notes are already attached."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          gh release view "$TAG" --json url,tagName,isDraft,isPrerelease,assets --jq '{url, tagName, isDraft, isPrerelease, assets: [.assets[].name]}'

  notes:
    name: Update the release notes
    needs: plan
    if: needs.plan.outputs.mode == 'notes'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update the release description
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          NOTES: ${{ needs.plan.outputs.notes }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --title "AD Manager ${VERSION}" --notes-file "$NOTES"
          gh release view "$TAG" --json url --jq .url
