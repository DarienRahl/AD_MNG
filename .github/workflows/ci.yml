name: CI

on:
  push:
    # "screenshots" only holds the pictures committed by the publish-screenshots job below.
    branches: ["**", "!screenshots"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  windows:
    name: Build, unit & UI smoke tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          # The newest 10.0 SDK (>= 10.0.113, runtime 10.0.13); global.json (10.0.100, latestFeature) accepts it.
          dotnet-version: "10.0.x"
      - name: Restore
        # Uses the repository nuget.config (nuget.org only, source mapping) and NuGetAudit (mode all).
        run: dotnet restore AdMng.slnx
      - name: Build
        run: dotnet build AdMng.slnx -c Release --no-restore
      - name: Unit tests
        # The whole solution, including the watchdog test projects (Windows-only tests such as the local Security-log
        # reader and DPAPI-NG run here; the Samba-based watchdog integration tests skip without ADMNG_TEST_LDAP_*).
        run: dotnet test AdMng.slnx -c Release --no-build --logger "trx" --results-directory TestResults
        env:
          ADMNG_UI_TESTS: "1"
          ADMNG_WINDOWS_EVENTLOG_TESTS: "1"
      - name: Publish (self-contained single file)
        run: dotnet publish src/AdMng.App/AdMng.App.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish
      - name: Smoke test published app
        if: hashFiles('src/AdMng.App/SmokeTest.cs') != ''
        shell: pwsh
        run: |
          # AdMng.exe is a GUI application: capture its report through redirected handles and print it.
          $p = Start-Process -FilePath publish/AdMng.exe -ArgumentList '--smoke-test' -PassThru -Wait `
            -RedirectStandardOutput smoke-out.txt -RedirectStandardError smoke-err.txt
          Get-Content smoke-out.txt, smoke-err.txt -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "Smoke test failed with exit code $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: AdMng-win-x64
          path: publish/
          retention-days: 14
      - name: Publish AdMng Watchdog (framework-dependent)
        # Framework-dependent, so Microsoft Update services the ASP.NET Core runtime on the server (spec 19.7).
        run: dotnet publish src/AdMng.Watchdog.Service/AdMng.Watchdog.Service.csproj -c Release -r win-x64 --self-contained false -o publish-watchdog
      - name: Smoke test published AdMng Watchdog
        # Temporary data folder, loopback HTTP, Development authentication, directory and attribution disabled:
        # migrations, /healthz, /api/v1/status and every formatter (spec 19.1).
        shell: pwsh
        run: |
          & publish-watchdog/AdMng.Watchdog.exe --smoke-test
          if ($LASTEXITCODE -ne 0) { throw "AdMng Watchdog smoke test failed with exit code $LASTEXITCODE" }
          foreach ($script in 'Install-AdMngWatchdog.ps1', 'AdMngWatchdog.Install.psm1', 'Uninstall-AdMngWatchdog.ps1') {
            if (-not (Test-Path "publish-watchdog/Deploy/$script")) { throw "Deploy/$script is missing from the publish output" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: AdMng-Watchdog-win-x64
          path: publish-watchdog/
          retention-days: 14
      - name: Screenshots
        # Renders the Polish UI over the sample company (tests/AdMng.App.UiTests/ScreenshotTests.cs) into PNG files and
        # manifest.json; the publish-screenshots job commits them to the "screenshots" branch.
        shell: pwsh
        run: |
          dotnet test tests/AdMng.App.UiTests -c Release --no-build --filter "FullyQualifiedName~AdMng.App.UiTests.ScreenshotTests" --logger "console;verbosity=normal"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $shots = @(Get-ChildItem -Path $env:ADMNG_SCREENSHOTS_DIR -Filter *.png -ErrorAction SilentlyContinue)
          if ($shots.Count -eq 0 -or -not (Test-Path (Join-Path $env:ADMNG_SCREENSHOTS_DIR 'manifest.json'))) {
            throw "No screenshots were written to $env:ADMNG_SCREENSHOTS_DIR (were the screenshot tests skipped?)"
          }
          $shots | ForEach-Object { "{0}  ({1:N0} bytes)" -f $_.Name, $_.Length }
        env:
          ADMNG_UI_TESTS: "1"
          ADMNG_SCREENSHOTS_DIR: ${{ github.workspace }}/screenshots
      - uses: actions/upload-artifact@v4
        # Also after a failed screenshot test: the pictures written so far help to see what went wrong.
        if: ${{ !cancelled() && hashFiles('screenshots/*.png') != '' }}
        with:
          name: screenshots
          path: screenshots/
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-windows
          path: TestResults/
          retention-days: 7

  integration:
    name: Integration tests (Samba AD DC lab)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # Public test values of the throwaway lab (tools/testlab/README.md) – no secrets are needed.
      ADMNG_TEST_LDAP_SERVER: 127.0.0.1
      ADMNG_TEST_LDAP_USER: Administrator@contoso.test
      ADMNG_TEST_LDAP_PASSWORD: P@ssw0rd!2026
      ADMNG_TEST_LDAP_READONLY_USER: odczyt.test@contoso.test
      ADMNG_TEST_LDAP_READONLY_PASSWORD: Passw0rd!Lab2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Set up Samba AD DC lab
        run: sudo LAB_USERS=400 LAB_COMPUTERS=250 tools/testlab/setup-samba-dc.sh
      - name: Integration tests
        run: dotnet test tests/AdMng.Directory.IntegrationTests -c Release
      # One project per "dotnet test" call (VSTest mode accepts a single project or solution, MSB1008 otherwise):
      # Linux coverage of the non-Windows code paths of the watchdog.
      - name: Watchdog Core tests (Linux)
        run: dotnet test tests/AdMng.Watchdog.Core.Tests -c Release
      - name: Watchdog Service tests (Linux)
        run: dotnet test tests/AdMng.Watchdog.Service.Tests -c Release
      - name: Start Mailpit
        run: tools/testlab/watchdog/start-mailpit.sh
      - name: Watchdog integration tests (Samba lab + Mailpit)
        run: dotnet test tests/AdMng.Watchdog.IntegrationTests -c Release
        env:
          ADMNG_TEST_SMTP_HOST: 127.0.0.1
          ADMNG_TEST_SMTP_PORT: "1025"
          ADMNG_TEST_MAILPIT_API: http://127.0.0.1:8025
      - name: Watchdog lab scenario (service, Mailpit, webhook sink)
        # The lab scripts end to end, so they never rot: the Lab launch profile in the background, the API
        # configuration, the scenario with its own verification (events, Polish e-mails, signed webhooks) and cleanup.
        run: |
          tools/testlab/watchdog/run-watchdog-lab.sh --reset --background
          tools/testlab/watchdog/configure-lab.sh --test
          tools/testlab/watchdog/lab-scenario.sh --verify
      - name: Watchdog lab logs
        if: failure()
        run: tail -n 200 ~/.cache/admng/watchdog-lab/watchdog.log ~/.cache/admng/watchdog-lab/webhook-sink.log || true
      - name: Stop the watchdog lab and Mailpit
        if: always()
        run: |
          tools/testlab/watchdog/lab-scenario.sh --cleanup || true
          tools/testlab/watchdog/run-watchdog-lab.sh --stop

  publish-screenshots:
    name: Publish screenshots (branch "screenshots")
    needs: windows
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The only job that writes to the repository: it commits the pictures of the windows job into the orphan branch
    # "screenshots", one folder per source branch, from where they are fetched with git.
    permissions:
      contents: write
    concurrency:
      group: screenshots-publish
      cancel-in-progress: false
    steps:
      - name: Download screenshots
        uses: actions/download-artifact@v4
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
      - name: Commit to the "screenshots" branch
        shell: bash
        env:
          SCREENSHOTS_DIR: ${{ runner.temp }}/screenshots
          SOURCE_BRANCH: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REMOTE_URL: ${{ github.server_url }}/${{ github.repository }}.git
          SERVER_URL: ${{ github.server_url }}
          GH_TOKEN: ${{ github.token }}
          RETRY_DELAY: "5"
        run: |
          set -euo pipefail
          branch=screenshots
          folder="${SOURCE_BRANCH//\//_}"
          case "$folder" in
            "" | . | ..) echo "::error::Cannot derive a folder name from the branch '$SOURCE_BRANCH'."; exit 1 ;;
          esac
          short_sha="${SOURCE_SHA:0:7}"
          shopt -s nullglob
          images=("$SCREENSHOTS_DIR"/*.png)
          if [ "${#images[@]}" -eq 0 ]; then
            echo "::error::No screenshots in $SCREENSHOTS_DIR."
            exit 1
          fi

          work="$(mktemp -d)"
          git init -q "$work"
          cd "$work"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "${GH_TOKEN:-}" ]; then
            # Authenticates like actions/checkout: an extra header for this server only, never part of a URL.
            auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            echo "::add-mask::$auth"
            git config "http.$SERVER_URL/.extraheader" "AUTHORIZATION: basic $auth"
          fi
          git remote add origin "$REMOTE_URL"

          # Puts the work tree on the tip of the remote branch, or on a new orphan branch when there is none yet.
          checkout_tip() {
            local status=0
            git ls-remote --exit-code --heads origin "refs/heads/$branch" > /dev/null || status=$?
            if [ "$status" -eq 0 ]; then
              git fetch -q --no-tags --depth=1 origin "+refs/heads/$branch:refs/remotes/origin/$branch"
              git checkout -q -f -B "$branch" "refs/remotes/origin/$branch"
            elif [ "$status" -eq 2 ]; then
              echo "The branch $branch does not exist yet: creating it as an orphan branch."
              git update-ref -d "refs/heads/$branch"
              git symbolic-ref HEAD "refs/heads/$branch"
              git read-tree --empty
            else
              echo "::error::git ls-remote failed (exit code $status)."
              return 1
            fi
            git clean -fdxq
          }

          write_readme() {
            echo "# Zrzuty ekranu – gałąź \`$SOURCE_BRANCH\`"
            echo
            echo "- Gałąź: \`$SOURCE_BRANCH\`"
            echo "- Commit: [\`$short_sha\`]($COMMIT_URL) (\`$SOURCE_SHA\`)"
            echo "- Przebieg CI: $RUN_URL"
            echo
            if [ -f "$SCREENSHOTS_DIR/manifest.json" ]; then
              jq -r '.[] | "\(.file)\t\(.title_pl)"' "$SCREENSHOTS_DIR/manifest.json"
            else
              for image in "${images[@]}"; do printf '%s\t%s\n' "${image##*/}" "${image##*/}"; done
            fi | while IFS=$'\t' read -r file title; do
              echo "## $title"
              echo
              echo "![$title]($file)"
              echo
            done
          }

          # Replaces the folder of the source branch with the new pictures and commits; committed=false when nothing
          # changed. Always call it as a plain command: inside an if/!/|| condition bash ignores "set -e" in the whole
          # function, so a failing cp/jq/git step would be skipped silently and a broken folder published.
          commit_folder() {
            committed=false
            rm -rf -- "$folder"
            mkdir -p -- "$folder"
            cp -- "${images[@]}" "$folder/"
            if [ -f "$SCREENSHOTS_DIR/manifest.json" ]; then
              cp -- "$SCREENSHOTS_DIR/manifest.json" "$folder/"
            fi
            write_readme > "$folder/README.md"
            if [ ! -f README.md ]; then
              printf '%s\n' "# Zrzuty ekranu AD_MNG" "" \
                "Gałąź tworzona automatycznie przez CI (zadanie publish-screenshots): jeden folder na gałąź źródłową" \
                "(\`/\` w nazwie zamienione na \`_\`), zastępowany przy każdym pushu. Opisy obrazów są w README.md folderu." \
                > README.md
              git add README.md
            fi
            git add -A -- "$folder"
            if git diff --cached --quiet; then
              return 0
            fi
            git commit -q -m "Screenshots $short_sha ($SOURCE_BRANCH)"
            committed=true
          }

          checkout_tip
          commit_folder
          if [ "$committed" != true ]; then
            echo "The screenshots of $SOURCE_BRANCH did not change: nothing to publish."
            exit 0
          fi

          for attempt in 1 2 3; do
            if git push -q origin "HEAD:refs/heads/$branch"; then
              echo "Published $folder/ to $branch as $(git rev-parse --short HEAD)."
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              break
            fi
            echo "::warning::Push to $branch rejected (attempt $attempt of 3): fetching it and rebasing."
            sleep $((attempt * RETRY_DELAY))
            if parent="$(git rev-parse -q --verify 'HEAD^')"; then
              upstream=("$parent")
            else
              upstream=(--root)
            fi
            git fetch -q --no-tags --depth=1 origin "+refs/heads/$branch:refs/remotes/origin/$branch"
            if ! git rebase -q --onto "refs/remotes/origin/$branch" "${upstream[@]}"; then
              # Only possible when someone else changed the same folder: re-apply ours on the new tip.
              git rebase --abort || true
              checkout_tip
              commit_folder
              if [ "$committed" != true ]; then
                echo "The branch $branch already has these screenshots."
                exit 0
              fi
            fi
          done
          echo "::error::Could not push to $branch after 3 attempts."
          exit 1

  linux-package:
    # AdMng Watchdog on Linux (docs/dev/watchdog-linux-design.md 13, 20 item 4, 21 B1): one amd64 .deb for Debian 12 and
    # 13, installed into plain Debian containers with the Microsoft repository (no systemd as PID 1 there: the units are
    # checked offline with systemd-analyze verify / security).
    name: Linux package (Debian 12 and 13)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build admng-watchdog .deb
        run: tools/packaging/build-deb.sh --output artifacts/deb
      - name: Install test on Debian 12 and 13
        # Users, modes, credential, certificate, idempotent postinst, systemd-analyze verify + security (exposure <= 2.0),
        # nft -c of the example ruleset, --check-config (placeholders fail, real SIDs pass), --smoke-test as
        # admng-watchdog, a Production start with the credential (/healthz over TLS), remove keeps the configuration,
        # purge keeps /var/lib/admng-watchdog.
        run: |
          deb=$(basename artifacts/deb/admng-watchdog_*_amd64.deb)
          for release in 12 13; do
            echo "::group::Debian $release"
            docker run --rm --cap-add=NET_ADMIN -v "$PWD:/src:ro" "mirror.gcr.io/library/debian:$release" \
              bash /src/tools/packaging/test-deb-install.sh "/src/artifacts/deb/$deb" /src/packaging/admng-watchdog
            echo "::endgroup::"
          done
      - name: lintian (Debian 13)
        run: |
          deb=$(basename artifacts/deb/admng-watchdog_*_amd64.deb)
          docker run --rm -v "$PWD:/src:ro" mirror.gcr.io/library/debian:13 bash -c \
            "apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends lintian >/dev/null \
             && lintian --fail-on error --no-tag-display-limit /src/artifacts/deb/$deb"
      - uses: actions/upload-artifact@v4
        with:
          name: admng-watchdog-deb
          path: artifacts/deb/*.deb
          retention-days: 14
