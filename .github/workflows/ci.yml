name: CI

on:
  push:
    # "screenshots" only holds the pictures committed by earlier CI runs (no longer updated).
    branches: ["**", "!screenshots"]
  pull_request:
  workflow_dispatch:
    inputs:
      screenshots:
        description: "Render the screenshots (artifact 'screenshots')"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  windows:
    name: Build, unit & UI smoke tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          # The newest 10.0 SDK (>= 10.0.113, runtime 10.0.13); global.json (10.0.100, latestFeature) accepts it.
          dotnet-version: "10.0.x"
      - name: Restore
        # Uses the repository nuget.config (nuget.org only, source mapping) and NuGetAudit (mode all).
        run: dotnet restore AdMng.slnx
      - name: Build
        run: dotnet build AdMng.slnx -c Release --no-restore
      - name: Unit tests
        # The whole solution, including the watchdog test projects (Windows-only tests such as the local Security-log
        # reader and DPAPI-NG run here; the Samba-based watchdog integration tests skip without ADMNG_TEST_LDAP_*).
        run: dotnet test AdMng.slnx -c Release --no-build --logger "trx" --results-directory TestResults
        env:
          ADMNG_UI_TESTS: "1"
          ADMNG_WINDOWS_EVENTLOG_TESTS: "1"
      - name: Publish (self-contained single file)
        run: dotnet publish src/AdMng.App/AdMng.App.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish
      - name: Smoke test published app
        if: hashFiles('src/AdMng.App/SmokeTest.cs') != ''
        shell: pwsh
        run: |
          # AdMng.exe is a GUI application: capture its report through redirected handles and print it.
          $p = Start-Process -FilePath publish/AdMng.exe -ArgumentList '--smoke-test' -PassThru -Wait `
            -RedirectStandardOutput smoke-out.txt -RedirectStandardError smoke-err.txt
          Get-Content smoke-out.txt, smoke-err.txt -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "Smoke test failed with exit code $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: AdMng-win-x64
          path: publish/
          retention-days: 14
      - name: Publish AdMng Watchdog (framework-dependent)
        # Framework-dependent, so Microsoft Update services the ASP.NET Core runtime on the server (spec 19.7).
        run: dotnet publish src/AdMng.Watchdog.Service/AdMng.Watchdog.Service.csproj -c Release -r win-x64 --self-contained false -o publish-watchdog
      - name: Smoke test published AdMng Watchdog
        # Temporary data folder, loopback HTTP, Development authentication, directory and attribution disabled:
        # migrations, /healthz, /api/v1/status and every formatter (spec 19.1).
        shell: pwsh
        run: |
          & publish-watchdog/AdMng.Watchdog.exe --smoke-test
          if ($LASTEXITCODE -ne 0) { throw "AdMng Watchdog smoke test failed with exit code $LASTEXITCODE" }
          foreach ($script in 'Install-AdMngWatchdog.ps1', 'AdMngWatchdog.Install.psm1', 'Uninstall-AdMngWatchdog.ps1') {
            if (-not (Test-Path "publish-watchdog/Deploy/$script")) { throw "Deploy/$script is missing from the publish output" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: AdMng-Watchdog-win-x64
          path: publish-watchdog/
          retention-days: 14
      - name: Screenshots
        # Renders the Polish UI over the sample company (tests/AdMng.App.UiTests/ScreenshotTests.cs) into PNG files and
        # manifest.json. Only on request (Run workflow with "screenshots"), not on every push: the pictures are large.
        # Releases render their own for major versions (release.yml).
        if: github.event_name == 'workflow_dispatch' && inputs.screenshots
        shell: pwsh
        run: |
          dotnet test tests/AdMng.App.UiTests -c Release --no-build --filter "FullyQualifiedName~AdMng.App.UiTests.ScreenshotTests" --logger "console;verbosity=normal"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $shots = @(Get-ChildItem -Path $env:ADMNG_SCREENSHOTS_DIR -Filter *.png -ErrorAction SilentlyContinue)
          if ($shots.Count -eq 0 -or -not (Test-Path (Join-Path $env:ADMNG_SCREENSHOTS_DIR 'manifest.json'))) {
            throw "No screenshots were written to $env:ADMNG_SCREENSHOTS_DIR (were the screenshot tests skipped?)"
          }
          $shots | ForEach-Object { "{0}  ({1:N0} bytes)" -f $_.Name, $_.Length }
        env:
          ADMNG_UI_TESTS: "1"
          ADMNG_SCREENSHOTS_DIR: ${{ github.workspace }}/screenshots
      - uses: actions/upload-artifact@v4
        # Also after a failed screenshot test: the pictures written so far help to see what went wrong.
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.screenshots && hashFiles('screenshots/*.png') != '' }}
        with:
          name: screenshots
          path: screenshots/
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-windows
          path: TestResults/
          retention-days: 7

  integration:
    name: Integration tests (Samba AD DC lab)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # Public test values of the throwaway lab (tools/testlab/README.md) – no secrets are needed.
      ADMNG_TEST_LDAP_SERVER: 127.0.0.1
      ADMNG_TEST_LDAP_USER: Administrator@contoso.test
      ADMNG_TEST_LDAP_PASSWORD: P@ssw0rd!2026
      ADMNG_TEST_LDAP_READONLY_USER: odczyt.test@contoso.test
      ADMNG_TEST_LDAP_READONLY_PASSWORD: Passw0rd!Lab2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Set up Samba AD DC lab
        run: sudo LAB_USERS=400 LAB_COMPUTERS=250 tools/testlab/setup-samba-dc.sh
      - name: Integration tests
        run: dotnet test tests/AdMng.Directory.IntegrationTests -c Release
      # One project per "dotnet test" call (VSTest mode accepts a single project or solution, MSB1008 otherwise):
      # Linux coverage of the non-Windows code paths of the watchdog.
      - name: Watchdog Core tests (Linux)
        run: dotnet test tests/AdMng.Watchdog.Core.Tests -c Release
      - name: Watchdog Service tests (Linux)
        run: dotnet test tests/AdMng.Watchdog.Service.Tests -c Release
      - name: Start Mailpit
        run: tools/testlab/watchdog/start-mailpit.sh
      - name: Watchdog integration tests (Samba lab + Mailpit)
        run: dotnet test tests/AdMng.Watchdog.IntegrationTests -c Release
        env:
          ADMNG_TEST_SMTP_HOST: 127.0.0.1
          ADMNG_TEST_SMTP_PORT: "1025"
          ADMNG_TEST_MAILPIT_API: http://127.0.0.1:8025
      - name: Messages to users – direct SMTP (Mailpit)
        run: dotnet test tests/AdMng.Mail.Tests -c Release
        env:
          ADMNG_TEST_SMTP_HOST: 127.0.0.1
          ADMNG_TEST_SMTP_PORT: "1025"
          ADMNG_TEST_MAILPIT_API: http://127.0.0.1:8025
      - name: Watchdog lab scenario (service, Mailpit, webhook sink)
        # The lab scripts end to end, so they never rot: the Lab launch profile in the background, the API
        # configuration, the scenario with its own verification (events, Polish e-mails, signed webhooks) and cleanup.
        run: |
          tools/testlab/watchdog/run-watchdog-lab.sh --reset --background
          tools/testlab/watchdog/configure-lab.sh --test
          tools/testlab/watchdog/lab-scenario.sh --verify
      - name: Watchdog lab logs
        if: failure()
        run: tail -n 200 ~/.cache/admng/watchdog-lab/watchdog.log ~/.cache/admng/watchdog-lab/webhook-sink.log || true
      # A dropped LDAP connection (ServerUnavailable) shows here as a crashed or restarted Samba worker.
      - name: Samba DC log
        if: failure()
        run: |
          sudo grep -n -i -E "panic|internal error|exited with|signal|backtrace|prefork" /var/log/samba/log.samba | tail -n 60 || true
          sudo tail -n 150 /var/log/samba/log.samba || true
          ps -eo pid,etimes,args | grep -E "[s]amba" | head -n 30 || true
      - name: Stop the watchdog lab and Mailpit
        if: always()
        run: |
          tools/testlab/watchdog/lab-scenario.sh --cleanup || true
          tools/testlab/watchdog/run-watchdog-lab.sh --stop

  openwec-package:
    # admng-openwec (docs/dev/watchdog-linux-design.md 7.1, 13.2, 21 B4): OpenWEC from the pinned upstream commit, built in
    # the release's Rust image so that it links that release's libssl/libkrb5/libsasl2 (libssl3 vs libssl3t64 in Depends,
    # from dpkg-shlibdeps). The Debian 13 job also writes the GPL-3.0 corresponding source (upstream tree, vendored crates,
    # the recipe) – a release asset next to the packages.
    name: OpenWEC package (Debian ${{ matrix.release }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: 12
            image: mirror.gcr.io/library/rust:slim-bookworm
          - release: 13
            image: mirror.gcr.io/library/rust:slim-trixie
    container: ${{ matrix.image }}
    steps:
      - name: Build dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            git ca-certificates pkgconf clang make libssl-dev libkrb5-dev libsasl2-dev dpkg-dev binutils xz-utils >/dev/null
      - uses: actions/checkout@v4
      - name: Build admng-openwec
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          extra=""
          if [ "${{ matrix.release }}" = 13 ]; then extra=--source-tarball; fi
          tools/packaging/build-openwec-deb.sh --release ${{ matrix.release }} --output artifacts/deb $extra
          dpkg-deb -I artifacts/deb/admng-openwec_*_amd64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: admng-openwec-deb${{ matrix.release }}
          path: |
            artifacts/deb/admng-openwec_*.deb
            artifacts/deb/admng-openwec-*-source.tar.xz
          retention-days: 14

  linux-package:
    # AdMng Watchdog on Linux (docs/dev/watchdog-linux-design.md 13, 20 item 4, 21 B1/B4): one amd64 .deb for Debian 12 and
    # 13, installed together with that release's admng-openwec into plain Debian containers with the Microsoft repository
    # (no systemd as PID 1 there: the units are checked offline with systemd-analyze verify / security).
    name: Linux package (Debian 12 and 13)
    needs: openwec-package
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/download-artifact@v4
        with:
          pattern: admng-openwec-deb*
          path: artifacts/openwec
          merge-multiple: true
      - name: Build admng-watchdog .deb
        run: tools/packaging/build-deb.sh --output artifacts/deb
      - name: Install test on Debian 12 and 13
        # Users, modes, credential, certificate, idempotent postinst, systemd-analyze verify + security (exposure <= 2.0),
        # nft -c of the example ruleset, --check-config (placeholders fail, real SIDs pass), --smoke-test as
        # admng-watchdog, a Production start with the credential (/healthz over TLS), remove keeps the configuration,
        # purge keeps /var/lib/admng-watchdog.
        run: |
          deb=$(basename artifacts/deb/admng-watchdog_*_amd64.deb)
          for release in 12 13; do
            echo "::group::Debian $release"
            openwec=$(basename artifacts/openwec/admng-openwec_*~deb${release}_amd64.deb)
            docker run --rm --cap-add=NET_ADMIN -v "$PWD:/src:ro" "mirror.gcr.io/library/debian:$release" \
              bash /src/tools/packaging/test-deb-install.sh "/src/artifacts/deb/$deb" /src/packaging/admng-watchdog \
              "/src/artifacts/openwec/$openwec"
            echo "::endgroup::"
          done
      - name: lintian (Debian 13)
        run: |
          deb=$(basename artifacts/deb/admng-watchdog_*_amd64.deb)
          openwec=$(basename artifacts/openwec/admng-openwec_*~deb13_amd64.deb)
          docker run --rm -v "$PWD:/src:ro" mirror.gcr.io/library/debian:13 bash -c \
            "apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends lintian >/dev/null \
             && lintian --fail-on error --no-tag-display-limit /src/artifacts/deb/$deb /src/artifacts/openwec/$openwec"
      - uses: actions/upload-artifact@v4
        with:
          name: admng-watchdog-deb
          path: artifacts/deb/*.deb
          retention-days: 14
