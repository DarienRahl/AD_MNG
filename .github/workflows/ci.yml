name: CI

on:
  push:
    # "screenshots" only holds the pictures committed by the publish-screenshots job below.
    branches: ["**", "!screenshots"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  windows:
    name: Build, unit & UI smoke tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore AdMng.slnx
      - name: Build
        run: dotnet build AdMng.slnx -c Release --no-restore
      - name: Unit tests
        run: dotnet test AdMng.slnx -c Release --no-build --logger "trx" --results-directory TestResults
        env:
          ADMNG_UI_TESTS: "1"
      - name: Publish (self-contained single file)
        run: dotnet publish src/AdMng.App/AdMng.App.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish
      - name: Smoke test published app
        if: hashFiles('src/AdMng.App/SmokeTest.cs') != ''
        shell: pwsh
        run: |
          # AdMng.exe is a GUI application: capture its report through redirected handles and print it.
          $p = Start-Process -FilePath publish/AdMng.exe -ArgumentList '--smoke-test' -PassThru -Wait `
            -RedirectStandardOutput smoke-out.txt -RedirectStandardError smoke-err.txt
          Get-Content smoke-out.txt, smoke-err.txt -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "Smoke test failed with exit code $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: AdMng-win-x64
          path: publish/
          retention-days: 14
      - name: Screenshots
        # Renders the Polish UI over the sample company (tests/AdMng.App.UiTests/ScreenshotTests.cs) into PNG files and
        # manifest.json; the publish-screenshots job commits them to the "screenshots" branch.
        shell: pwsh
        run: |
          dotnet test tests/AdMng.App.UiTests -c Release --no-build --filter "FullyQualifiedName~AdMng.App.UiTests.ScreenshotTests" --logger "console;verbosity=normal"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $shots = @(Get-ChildItem -Path $env:ADMNG_SCREENSHOTS_DIR -Filter *.png -ErrorAction SilentlyContinue)
          if ($shots.Count -eq 0 -or -not (Test-Path (Join-Path $env:ADMNG_SCREENSHOTS_DIR 'manifest.json'))) {
            throw "No screenshots were written to $env:ADMNG_SCREENSHOTS_DIR (were the screenshot tests skipped?)"
          }
          $shots | ForEach-Object { "{0}  ({1:N0} bytes)" -f $_.Name, $_.Length }
        env:
          ADMNG_UI_TESTS: "1"
          ADMNG_SCREENSHOTS_DIR: ${{ github.workspace }}/screenshots
      - uses: actions/upload-artifact@v4
        # Also after a failed screenshot test: the pictures written so far help to see what went wrong.
        if: ${{ !cancelled() && hashFiles('screenshots/*.png') != '' }}
        with:
          name: screenshots
          path: screenshots/
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-windows
          path: TestResults/
          retention-days: 7

  integration:
    name: Integration tests (Samba AD DC lab)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Set up Samba AD DC lab
        run: sudo LAB_USERS=400 LAB_COMPUTERS=250 tools/testlab/setup-samba-dc.sh
      - name: Integration tests
        run: dotnet test tests/AdMng.Directory.IntegrationTests -c Release
        env:
          ADMNG_TEST_LDAP_SERVER: 127.0.0.1
          ADMNG_TEST_LDAP_USER: Administrator@contoso.test
          ADMNG_TEST_LDAP_PASSWORD: P@ssw0rd!2026

  publish-screenshots:
    name: Publish screenshots (branch "screenshots")
    needs: windows
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The only job that writes to the repository: it commits the pictures of the windows job into the orphan branch
    # "screenshots", one folder per source branch, from where they are fetched with git.
    permissions:
      contents: write
    concurrency:
      group: screenshots-publish
      cancel-in-progress: false
    steps:
      - name: Download screenshots
        uses: actions/download-artifact@v4
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
      - name: Commit to the "screenshots" branch
        shell: bash
        env:
          SCREENSHOTS_DIR: ${{ runner.temp }}/screenshots
          SOURCE_BRANCH: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REMOTE_URL: ${{ github.server_url }}/${{ github.repository }}.git
          SERVER_URL: ${{ github.server_url }}
          GH_TOKEN: ${{ github.token }}
          RETRY_DELAY: "5"
        run: |
          set -euo pipefail
          branch=screenshots
          folder="${SOURCE_BRANCH//\//_}"
          case "$folder" in
            "" | . | ..) echo "::error::Cannot derive a folder name from the branch '$SOURCE_BRANCH'."; exit 1 ;;
          esac
          short_sha="${SOURCE_SHA:0:7}"
          shopt -s nullglob
          images=("$SCREENSHOTS_DIR"/*.png)
          if [ "${#images[@]}" -eq 0 ]; then
            echo "::error::No screenshots in $SCREENSHOTS_DIR."
            exit 1
          fi

          work="$(mktemp -d)"
          git init -q "$work"
          cd "$work"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "${GH_TOKEN:-}" ]; then
            # Authenticates like actions/checkout: an extra header for this server only, never part of a URL.
            auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            echo "::add-mask::$auth"
            git config "http.$SERVER_URL/.extraheader" "AUTHORIZATION: basic $auth"
          fi
          git remote add origin "$REMOTE_URL"

          # Puts the work tree on the tip of the remote branch, or on a new orphan branch when there is none yet.
          checkout_tip() {
            local status=0
            git ls-remote --exit-code --heads origin "refs/heads/$branch" > /dev/null || status=$?
            if [ "$status" -eq 0 ]; then
              git fetch -q --no-tags --depth=1 origin "+refs/heads/$branch:refs/remotes/origin/$branch"
              git checkout -q -f -B "$branch" "refs/remotes/origin/$branch"
            elif [ "$status" -eq 2 ]; then
              echo "The branch $branch does not exist yet: creating it as an orphan branch."
              git update-ref -d "refs/heads/$branch"
              git symbolic-ref HEAD "refs/heads/$branch"
              git read-tree --empty
            else
              echo "::error::git ls-remote failed (exit code $status)."
              return 1
            fi
            git clean -fdxq
          }

          write_readme() {
            echo "# Zrzuty ekranu – gałąź \`$SOURCE_BRANCH\`"
            echo
            echo "- Gałąź: \`$SOURCE_BRANCH\`"
            echo "- Commit: [\`$short_sha\`]($COMMIT_URL) (\`$SOURCE_SHA\`)"
            echo "- Przebieg CI: $RUN_URL"
            echo
            if [ -f "$SCREENSHOTS_DIR/manifest.json" ]; then
              jq -r '.[] | "\(.file)\t\(.title_pl)"' "$SCREENSHOTS_DIR/manifest.json"
            else
              for image in "${images[@]}"; do printf '%s\t%s\n' "${image##*/}" "${image##*/}"; done
            fi | while IFS=$'\t' read -r file title; do
              echo "## $title"
              echo
              echo "![$title]($file)"
              echo
            done
          }

          # Replaces the folder of the source branch with the new pictures and commits; fails when nothing changed.
          commit_folder() {
            rm -rf -- "$folder"
            mkdir -p -- "$folder"
            cp -- "${images[@]}" "$folder/"
            if [ -f "$SCREENSHOTS_DIR/manifest.json" ]; then
              cp -- "$SCREENSHOTS_DIR/manifest.json" "$folder/"
            fi
            write_readme > "$folder/README.md"
            if [ ! -f README.md ]; then
              printf '%s\n' "# Zrzuty ekranu AD_MNG" "" \
                "Gałąź tworzona automatycznie przez CI (zadanie publish-screenshots): jeden folder na gałąź źródłową" \
                "(\`/\` w nazwie zamienione na \`_\`), zastępowany przy każdym pushu. Opisy obrazów są w README.md folderu." \
                > README.md
              git add README.md
            fi
            git add -A -- "$folder"
            if git diff --cached --quiet; then
              return 1
            fi
            git commit -q -m "Screenshots $short_sha ($SOURCE_BRANCH)"
          }

          checkout_tip
          if ! commit_folder; then
            echo "The screenshots of $SOURCE_BRANCH did not change: nothing to publish."
            exit 0
          fi

          for attempt in 1 2 3; do
            if git push -q origin "HEAD:refs/heads/$branch"; then
              echo "Published $folder/ to $branch as $(git rev-parse --short HEAD)."
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              break
            fi
            echo "::warning::Push to $branch rejected (attempt $attempt of 3): fetching it and rebasing."
            sleep $((attempt * RETRY_DELAY))
            if parent="$(git rev-parse -q --verify 'HEAD^')"; then
              upstream=("$parent")
            else
              upstream=(--root)
            fi
            git fetch -q --no-tags --depth=1 origin "+refs/heads/$branch:refs/remotes/origin/$branch"
            if ! git rebase -q --onto "refs/remotes/origin/$branch" "${upstream[@]}"; then
              # Only possible when someone else changed the same folder: re-apply ours on the new tip.
              git rebase --abort || true
              checkout_tip
              if ! commit_folder; then
                echo "The branch $branch already has these screenshots."
                exit 0
              fi
            fi
          done
          echo "::error::Could not push to $branch after 3 attempts."
          exit 1
